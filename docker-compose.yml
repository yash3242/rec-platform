version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: rec_platform_postgres
    environment:
      POSTGRES_DB: rec_platform
      POSTGRES_USER: rec_user
      POSTGRES_PASSWORD: change-me-db-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
